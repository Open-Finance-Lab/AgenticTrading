# Polygon.io API configuration

agent_id: polygon_agent
api:
  base_url: "https://api.polygon.io"
  endpoints:
    ohlcv: "/v2/aggs/ticker/{symbol}/range"
    company_info: "/v3/reference/tickers/{symbol}"
    # ...可继续扩展
  default_interval: "1d"
authentication:
  api_key: "demo"  # Set your Polygon key here locally; never commit it (the previous value is public in git history and must be revoked)
  secret_key: ""
constraints:
  timeout: 30
  rate_limit_per_minute: 120
llm_enabled: True