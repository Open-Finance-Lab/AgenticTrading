    <style id="landing-auth-patch">
      /* Hide page until auth gate finishes (avoids flash for logged-in users). */
      html.landing-auth-pending body { visibility: hidden; }
      html.landing-ready body { visibility: visible; }

      /* Auth modal on landing (signup / sign-in stay on this page) */
      .landing-auth-modal[hidden] { display: none !important; }
      .landing-auth-modal {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .landing-auth-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
      }
      .landing-auth-panel {
        position: relative;
        width: min(420px, 100%);
        background: #0b1220;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 28px 24px 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
      }
      .landing-auth-close {
        position: absolute;
        top: 10px;
        right: 14px;
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }
      .landing-auth-close:hover { color: #f8fafc; }
      .landing-auth-title {
        margin: 0 0 6px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      .landing-auth-subtitle {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 0.875rem;
        line-height: 1.4;
      }
      .landing-auth-form { display: grid; gap: 14px; }
      .landing-auth-field {
        display: grid;
        gap: 6px;
        font-size: 0.8rem;
        color: #94a3b8;
      }
      .landing-auth-field[hidden] { display: none !important; }
      .landing-auth-field input {
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 8px;
        background: #020617;
        color: #f8fafc;
        font-size: 0.95rem;
      }
      .landing-auth-field input:focus {
        outline: none;
        border-color: #38bdf8;
      }
      .landing-auth-error {
        margin: 0;
        color: #f87171;
        font-size: 0.8rem;
      }
      .landing-auth-error[hidden] { display: none !important; }
      .landing-auth-submit {
        padding: 11px 14px;
        border: none;
        border-radius: 8px;
        background: #0ea5e9;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        width: 100%;
      }
      .landing-auth-submit:hover { filter: brightness(1.08); }
      .landing-auth-submit:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .landing-auth-switch {
        margin: 16px 0 0;
        text-align: center;
      }
      .landing-auth-link {
        border: none;
        background: transparent;
        color: #38bdf8;
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
    <script>
      // ONE LANDING PAGE FOR BOTH AUDIENCES. This used to read "Landing is
      // for first-time / logged-out visitors only. Logged-in users go straight
      // to the dashboard." and it did exactly that -- window.location.replace
      // to /app the moment /api/auth/me came back ok, so a signed-in visitor
      // could not reach / at all and the two homepages were free to diverge
      // into two different products.
      //
      // The fetch stays, and its job is now the ONLY job it has: decide whether
      // the cached auth-user is still backed by a live cookie session. Both
      // answers end on this page; what they change is which CTAs the React
      // bundle renders, which it reads back out of localStorage.
      document.documentElement.classList.add('landing-auth-pending');
      (function () {
        // No APP_URL here any more: this script's only use for it was the
        // redirect. The modal script below still declares its own, for the
        // post-signup navigation that is still correct.
        var AUTH_TOKEN_KEY = 'auth-token';
        var AUTH_USER_KEY = 'auth-user';
        var host = window.location.hostname;
        var API_BASE = (host === 'localhost' || host === '127.0.0.1')
          ? window.location.origin
          : '';

        // 1200ms IS A DEADLINE FOR THE FETCH, NOT FOR THE HOMEPAGE. A warm
        // /api/auth/me answers in well under this on Render, so the ordinary
        // case still corrects the cached profile before first paint and never
        // flashes signed-in CTAs it has to swap out. What this bounds is the
        // two cases a bare fetch()+.then/.catch cannot: a free-tier cold start
        // (30-60s) and a request that never settles at all, which reaches
        // neither .then nor .catch and used to leave landing-auth-pending on
        // <html> -- and the page blank under `visibility: hidden` -- forever.
        var REVEAL_TIMEOUT_MS = 1200;

        function clearAuth() {
          try {
            localStorage.removeItem(AUTH_TOKEN_KEY);
            localStorage.removeItem(AUTH_USER_KEY);
          } catch (e) { /* ignore */ }
          // THE STORAGE EVENT DOES NOT FIRE IN THE TAB THAT WROTE, and this is
          // that tab. landing/src/lib/session.ts drives every CTA off this key,
          // so without an explicit notification an expired session keeps being
          // offered "Test a trading idea" -- a link into an app that will bounce
          // it straight back to sign in. Kept in sync by name with
          // LANDING_AUTH_EVENT there; this page has no build step to share the
          // constant across the split, the same reason 'nav-state' is a literal
          // below.
          try {
            window.dispatchEvent(new Event('landing-auth-change'));
          } catch (e) { /* ignore */ }
        }

        // IDEMPOTENT ON PURPOSE -- it is now called from up to two places for
        // one page load (the timer and whichever of .then/.catch settles), and
        // the second call must be a no-op rather than a second class flip.
        // `revealed` also stops a late-settling fetch from re-adding anything
        // after the timer has already painted the page.
        var revealed = false;
        var revealTimer = null;
        function showLanding() {
          if (revealed) return;
          revealed = true;
          if (revealTimer !== null) {
            clearTimeout(revealTimer);
            revealTimer = null;
          }
          document.documentElement.classList.remove('landing-auth-pending');
          document.documentElement.classList.add('landing-ready');
        }

        // `redirectToDashboard()` lived here. Deleted rather than left unused:
        // an unreferenced one-line helper that navigates away from this page is
        // an invitation to call it again.

        // ?stay=1 IS GONE FROM THIS BRANCH, AND THE PARAMETER IS NOW INERT.
        // It existed to escape the redirect; with the redirect gone every visit
        // behaves the way ?stay=1 used to, so the flag had nothing left to do --
        // except the one thing it must not do. Skipping the fetch does not
        // produce the signed-out page it used to: this branch is only reachable
        // WITH a cached profile (the !cachedUser test short-circuits first), so it
        // skipped the revalidation and left that profile standing. A bookmarked
        // /?stay=1 whose session had since expired rendered "Test a trading
        // idea" on every visit, forever, linking into an app that bounces the
        // visitor back to sign in -- and nothing on that URL could ever correct
        // itself, because the only thing that corrects it is the fetch it
        // skipped. The parameter still parses harmlessly in any URL that carries
        // it; it simply no longer changes what happens.
        var cachedUser = null;
        try { cachedUser = localStorage.getItem(AUTH_USER_KEY); } catch (e) { cachedUser = null; }

        if (!cachedUser) {
          showLanding();
          return;
        }

        // ARMED BEFORE THE FETCH, NOT AFTER IT. `fetch` can throw synchronously
        // on a malformed URL, and a timer armed on the next line would never be
        // set in that case -- the one failure mode that leaves the page blank
        // with no promise to settle. Passing the function by reference rather
        // than wrapping it in `function () { showLanding(); }` keeps this a
        // timeout on the reveal, not a second code path to keep in sync.
        revealTimer = setTimeout(showLanding, REVEAL_TIMEOUT_MS);

        fetch(API_BASE + '/api/auth/me', {
          credentials: 'include',
        }).then(function (res) {
          // 401/403 ONLY, NOT EVERY NON-2xx. Those two are the statuses that
          // prove the cookie session is gone; a 500 or a 502 proves the backend
          // is having a bad minute, which on a free-tier instance that
          // cold-starts in 30-60s is an ordinary first-visit-of-the-day event.
          // Clearing on those wipes auth-token and auth-user out from under a
          // visitor holding a perfectly valid session -- swapping every CTA to
          // "Start Free" and demoting /app's own pre-hydration boot, which reads
          // the same key. It would also put this branch in direct disagreement
          // with the .catch below, which refuses to do exactly that for a
          // network failure and says why.
          if (res.status === 401 || res.status === 403) {
            // The cached profile is a ghost. clearAuth() both removes it and
            // tells the mounted React tree, so the CTAs fall back to signed-out
            // rather than offering a dashboard this visitor cannot open.
            //
            // THIS STILL RUNS AFTER A TIMED-OUT REVEAL, and that is the point of
            // doing it before showLanding() rather than instead of it. The
            // timeout only decides WHEN the page becomes visible; it does not
            // cancel the revalidation, so a slow 401 still corrects the CTAs --
            // visibly swapping them, which is the honest outcome and strictly
            // better than a blank page that would have shown the same swap.
            clearAuth();
          }
          showLanding();
        }).catch(function () {
          // NETWORK ERROR KEEPS THE LOCAL SESSION AND SHOWS THE PAGE. It used
          // to send them to /app on the reasoning that a cached session is
          // better than none -- a reasonable call when the alternative was a
          // marketing page they had already converted past. There is no
          // alternative now: this page IS the signed-in page. Clearing the
          // profile instead would demote a signed-in visitor to the anonymous
          // CTAs because a request failed, which is the worse of the two errors.
          showLanding();
        });
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>

    <div id="landingAuthModal" class="landing-auth-modal" hidden>
      <div class="landing-auth-backdrop" id="landingAuthBackdrop"></div>
      <div class="landing-auth-panel" role="dialog" aria-modal="true" aria-labelledby="landingAuthTitle">
        <button id="landingAuthClose" class="landing-auth-close" type="button" aria-label="Close">×</button>
        <h2 id="landingAuthTitle" class="landing-auth-title">Sign up</h2>
        <p id="landingAuthSubtitle" class="landing-auth-subtitle">Create an account to open your dashboard.</p>
        <form id="landingAuthForm" class="landing-auth-form">
          <label class="landing-auth-field">
            <span>Email</span>
            <input id="landingAuthEmail" type="email" autocomplete="email" required>
          </label>
          <label id="landingAuthDisplayNameField" class="landing-auth-field">
            <span>Display name</span>
            <input id="landingAuthDisplayName" type="text" autocomplete="name">
          </label>
          <label class="landing-auth-field">
            <span>Password</span>
            <input id="landingAuthPassword" type="password" autocomplete="new-password" required minlength="8">
          </label>
          <p id="landingAuthForgot" class="landing-auth-switch" hidden>
            <a class="landing-auth-link" href="/app?auth=reset">Forgot password?</a>
          </p>
          <p id="landingAuthError" class="landing-auth-error" hidden></p>
          <button id="landingAuthSubmit" class="landing-auth-submit" type="submit">Create account</button>
        </form>
        <p class="landing-auth-switch">
          <button id="landingAuthSwitch" class="landing-auth-link" type="button">Already have an account? Sign in</button>
        </p>
      </div>
    </div>

    <script>
      (function () {
        var APP_URL = '/app';
        var AUTH_TOKEN_KEY = 'auth-token';
        var AUTH_USER_KEY = 'auth-user';
        var host = window.location.hostname;
        var API_BASE = (host === 'localhost' || host === '127.0.0.1')
          ? window.location.origin
          : '';

        var authMode = 'signup';

        function setAuthMode(mode) {
          authMode = mode === 'login' ? 'login' : 'signup';
          var title = document.getElementById('landingAuthTitle');
          var subtitle = document.getElementById('landingAuthSubtitle');
          var submitBtn = document.getElementById('landingAuthSubmit');
          var switchBtn = document.getElementById('landingAuthSwitch');
          var passwordInput = document.getElementById('landingAuthPassword');
          var displayNameField = document.getElementById('landingAuthDisplayNameField');
          var displayNameInput = document.getElementById('landingAuthDisplayName');
          var errorEl = document.getElementById('landingAuthError');

          if (title) title.textContent = authMode === 'signup' ? 'Sign up' : 'Sign in';
          if (subtitle) {
            subtitle.textContent = authMode === 'signup'
              ? 'Create an account to open your dashboard.'
              : 'Sign in to continue to your dashboard.';
          }
          if (submitBtn) submitBtn.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
          if (switchBtn) {
            switchBtn.textContent = authMode === 'signup'
              ? 'Already have an account? Sign in'
              : 'Need an account? Sign up';
          }
          if (passwordInput) {
            passwordInput.autocomplete = authMode === 'signup' ? 'new-password' : 'current-password';
          }
          if (displayNameField) displayNameField.hidden = authMode !== 'signup';
          // No reset UI here: the reset flow lives in /app only, so this stays
          // a plain deep link, shown in login mode where "I forgot" happens.
          var forgotEl = document.getElementById('landingAuthForgot');
          if (forgotEl) forgotEl.hidden = authMode !== 'login';
          if (displayNameInput) {
            displayNameInput.required = authMode === 'signup';
            if (authMode !== 'signup') displayNameInput.value = '';
          }
          if (errorEl) errorEl.hidden = true;
        }

        function openAuthModal(mode) {
          var modal = document.getElementById('landingAuthModal');
          if (!modal) return;
          setAuthMode(mode);
          modal.hidden = false;
          document.body.style.overflow = 'hidden';
          var email = document.getElementById('landingAuthEmail');
          if (email) setTimeout(function () { email.focus(); }, 0);
        }

        function closeAuthModal() {
          var modal = document.getElementById('landingAuthModal');
          var form = document.getElementById('landingAuthForm');
          var errorEl = document.getElementById('landingAuthError');
          if (modal) modal.hidden = true;
          if (form) form.reset();
          if (errorEl) errorEl.hidden = true;
          document.body.style.overflow = '';
          setAuthMode('signup');
        }

        async function authRequest(path, body) {
          var response = await fetch(API_BASE + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body),
          });
          var data = null;
          try { data = await response.json(); } catch (e) { data = null; }
          if (!response.ok) {
            var message = data && (data.detail || data.error) || ('HTTP ' + response.status);
            throw new Error(typeof message === 'string' ? message : JSON.stringify(message));
          }
          return data;
        }

        function goToDashboardLoggedIn(user) {
          try {
            try { localStorage.removeItem(AUTH_TOKEN_KEY); } catch (e) { /* ignore */ }
            localStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));
            // Land authenticated users on My Agents, for both sign-up and
            // sign-in. Sign-up used to go to '?view=home', which is a second
            // marketing hero -- the same "Talk to Agents / Test Trading Ideas"
            // pitch and a "Get Started" button the user had just clicked. Sign-in
            // used to go to a bare '/app', which restores whatever tab was last
            // visited while logged out, so a returning user could land on
            // Competition. Neither put anyone near their agent.
            // 'nav-state' must match app.js's NAV_STATE_KEY -- this landing
            // page has no build step to share that constant across the split.
            // The '?view=' below already wins over saved nav-state on boot; this
            // write keeps a *later* bare '/app' visit off the stale tab too.
            localStorage.setItem(
              'nav-state',
              JSON.stringify({ page: 'playground', playgroundTab: 'agents' })
            );
          } catch (e) { /* ignore */ }
          window.location.href = APP_URL + '?view=agents';
        }

        function initAuthModal() {
          var closeBtn = document.getElementById('landingAuthClose');
          var backdrop = document.getElementById('landingAuthBackdrop');
          var switchBtn = document.getElementById('landingAuthSwitch');
          var form = document.getElementById('landingAuthForm');

          closeBtn && closeBtn.addEventListener('click', closeAuthModal);
          backdrop && backdrop.addEventListener('click', closeAuthModal);
          switchBtn && switchBtn.addEventListener('click', function () {
            setAuthMode(authMode === 'signup' ? 'login' : 'signup');
          });

          document.addEventListener('keydown', function (event) {
            if (event.key !== 'Escape') return;
            var modal = document.getElementById('landingAuthModal');
            if (modal && !modal.hidden) closeAuthModal();
          });

          form && form.addEventListener('submit', async function (event) {
            event.preventDefault();
            var email = (document.getElementById('landingAuthEmail') || {}).value;
            var displayName = (document.getElementById('landingAuthDisplayName') || {}).value;
            var password = (document.getElementById('landingAuthPassword') || {}).value;
            var errorEl = document.getElementById('landingAuthError');
            var submitBtn = document.getElementById('landingAuthSubmit');

            email = (email || '').trim();
            displayName = (displayName || '').trim();
            if (!email || !password) return;

            if (authMode === 'signup' && !displayName) {
              if (errorEl) {
                errorEl.textContent = 'Display name is required for sign up.';
                errorEl.hidden = false;
              }
              return;
            }

            if (submitBtn) submitBtn.disabled = true;
            if (errorEl) errorEl.hidden = true;

            try {
              var data = authMode === 'signup'
                ? await authRequest('/api/auth/signup', {
                    email: email,
                    display_name: displayName,
                    password: password,
                  })
                : await authRequest('/api/auth/login', {
                    email: email,
                    password: password,
                  });
              goToDashboardLoggedIn(data.user);
            } catch (error) {
              if (errorEl) {
                errorEl.textContent = error.message || 'Something went wrong. Please try again.';
                errorEl.hidden = false;
              }
              if (submitBtn) submitBtn.disabled = false;
            }
          });
        }

        document.addEventListener('click', function (event) {
          var target = event.target;
          if (!target || !target.closest) return;

          var authTrigger = target.closest('[data-landing-auth]');
          if (authTrigger) {
            event.preventDefault();
            openAuthModal(authTrigger.getAttribute('data-landing-auth') === 'login' ? 'login' : 'signup');
            return;
          }

          // Fallback for CTA labels that omit the data attribute.
          var button = target.closest('button, a');
          if (!button) return;
          var label = (button.textContent || '').trim();
          if (label === 'Start Free' || label === 'Get Started') {
            event.preventDefault();
            openAuthModal('signup');
          }
        });

        initAuthModal();
      })();
    </script>
  </body>
