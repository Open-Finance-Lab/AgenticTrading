name: Live Leaderboard refresh

# After the US cash close settles, freeze the day's baselines/indices on the
# Live board. Public GET never computes, so this job is what fills the board.
# The API returns 202 immediately; the work continues on the Render instance.
#
# LLM deploys are BILLABLE and strictly opt-in: the nightly run appends one
# session onto each Live LLM snapshot (cash + positions carried forward) only
# when the repository variable LIVE_LEADERBOARD_DEPLOY_MODELS is exactly
# "true" — a recurring API cost for 3 models every weekday. Unset, the
# schedule refreshes baselines only. A manual dispatch defaults to off too.
#
# Requires repository secret LEADERBOARD_DAILY_REFRESH_SECRET matching
# the value configured on the Render service (same secret as the daily hook).

on:
  schedule:
    # 22:30 UTC Mon–Fri ≈ 18:30 EDT / 17:30 EST — after the 16:00 ET cash close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy_models:
        description: "Append Live LLM roster for the latest cash session (billable)"
        type: boolean
        default: false
      force:
        description: "Replay the whole month from the 1st (expensive — leave off)"
        type: boolean
        default: false

# The job only POSTs to the API; it needs no repository access.
permissions: {}

concurrency:
  group: live-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    name: Enqueue live board increment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST live refresh (202 Accepted)
        env:
          ATL_API: ${{ vars.ATL_API || 'https://agentictrading.onrender.com' }}
          LEADERBOARD_DAILY_REFRESH_SECRET: ${{ secrets.LEADERBOARD_DAILY_REFRESH_SECRET }}
          DEPLOY_MODELS: ${{ github.event_name != 'workflow_dispatch' && (vars.LIVE_LEADERBOARD_DEPLOY_MODELS == 'true' && 'true' || 'false') || (inputs.deploy_models && 'true' || 'false') }}
          FORCE: ${{ github.event_name != 'workflow_dispatch' && 'false' || (inputs.force && 'true' || 'false') }}
        run: |
          set -euo pipefail
          if [ -z "$LEADERBOARD_DAILY_REFRESH_SECRET" ]; then
            echo "LEADERBOARD_DAILY_REFRESH_SECRET is not configured." >&2
            exit 1
          fi
          case "$DEPLOY_MODELS" in
            true|false) ;;
            *) echo "Unexpected DEPLOY_MODELS='$DEPLOY_MODELS'" >&2; exit 1 ;;
          esac
          case "$FORCE" in
            true|false) ;;
            *) echo "Unexpected FORCE='$FORCE'" >&2; exit 1 ;;
          esac
          echo "deploy_models=$DEPLOY_MODELS force=$FORCE"
          curl --silent --show-error --fail \
            --max-time 120 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            -X POST "${ATL_API%/}/api/v1/leaderboard/live/refresh?deploy_models=${DEPLOY_MODELS}&force=${FORCE}" \
            -H "X-Leaderboard-Refresh-Secret: ${LEADERBOARD_DAILY_REFRESH_SECRET}"
          echo
          echo "Accepted. Poll GET /api/v1/leaderboard?period=live for live_status."
